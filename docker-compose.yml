services:

  postgres:
    image: postgis/postgis:17-3.5

    environment:
      POSTGRES_DB: instaclone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest

    # ports:
    #   - "6379:6379"

  backend1:
    build: .

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/instaclone
      REDIS_URL: redis://redis:6379

    ports:
      - "3000:3000"

    depends_on:
      - postgres
      - redis

  backend2:
    build: .

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/instaclone
      REDIS_URL: redis://redis:6379

    ports:
      - "3001:3000"

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: